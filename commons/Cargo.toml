[package]
name = "hic-commons"
version = "0.1.0"
edition = "2021"
description = "Held in Common — the commons server (directory, identity, content-addressed publishing, ActivityPub-ready)"

[[bin]]
name = "hic-commons"
path = "main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "set-header"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["std", "chacha20"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
form_urlencoded = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 2
