[package]
name = "hic-commons"
version = "0.5.1"
edition = "2021"
description = "Held in Common — the commons server (directory, identity, content-addressed publishing, ActivityPub-ready)"

# The library (src/lib.rs) holds all behaviour; the binary (src/main.rs) only
# starts it. Integration tests in tests/ use the library directly.
[lib]
name = "hic_commons"
path = "src/lib.rs"

[[bin]]
name = "hic-commons"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
maud = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "set-header"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
crypto_box = { version = "0.9", features = ["std", "chacha20"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
form_urlencoded = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 2
