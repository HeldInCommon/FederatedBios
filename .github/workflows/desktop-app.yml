# Builds the native node app for macOS / Windows / Linux and attaches
# installers to the 'node-app-preview' prerelease.
#
# macOS builds are SIGNED + NOTARIZED when these repo secrets are present
# (Settings -> Secrets and variables -> Actions):
#   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password used when exporting that .p12
#   APPLE_SIGNING_IDENTITY     "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID                   an Apple ID that is a member of the signing team
#   APPLE_PASSWORD             an app-specific password for that Apple ID
#   APPLE_TEAM_ID              the 10-char Team ID (e.g. University of the Arts London's)
# If the secrets are absent the build still runs but stays unsigned (tauri-action
# skips signing when APPLE_CERTIFICATE is empty) — so add ALL SIX together.
# Windows signing is a follow-up (needs a code-signing cert + a sign step).
name: desktop-app
on:
  workflow_dispatch:
  push:
    tags: ['node-app-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon .dmg/.app
          - os: ubuntu-22.04       # .deb + .AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Build node sidecar for this OS
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          cargo build --release --manifest-path commons/Cargo.toml
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp commons/target/release/hic-commons.exe "src-tauri/binaries/hic-commons-$TRIPLE.exe"
          else
            cp commons/target/release/hic-commons "src-tauri/binaries/hic-commons-$TRIPLE"
          fi
      - name: Build + release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. Empty on non-mac runners and when
          # the secrets aren't set (tauri-action then skips signing cleanly).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: node-app-preview
          releaseName: "Held In Common"
          releaseBody: "Held in Common — desktop node app. Download the file for your OS (macOS Apple Silicon .dmg, Linux .deb/.AppImage/.rpm), open it, and you're a node. See docs/INSTALL.md."
          prerelease: true
