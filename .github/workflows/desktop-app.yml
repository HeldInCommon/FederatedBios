# Builds the native node app and attaches installers to the release for this
# version, v<version> (e.g. v0.4.0), creating it if needed.
#
# A pushed node-app-v* tag builds Linux for both x86 (ubuntu-22.04) and ARM
# (ubuntu-22.04-arm, e.g. the DGX Spark or a Raspberry Pi 5). The Mac app is
# released from a Mac with scripts/release-mac.sh (faster, and signed with the
# maintainer's own keychain), so a tag doesn't build it. Run by hand, choose
# linux (both), macos or all.
#
# macOS builds are SIGNED with a Developer ID Application certificate and
# NOTARIZED by Apple, so the .dmg opens normally (no "disk is damaged" step).
# The signing secrets live in the protected GitHub environment `macos-signing`
# (Settings -> Environments), which only `main` and `node-app-v*` tags may use,
# so a workflow on any other branch cannot read them. Six secrets, all required:
#   APPLE_CERTIFICATE          base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD the password chosen when exporting that .p12
#   APPLE_SIGNING_IDENTITY     "Developer ID Application: NAME (TEAMID)"
#   APPLE_ID                   the Apple ID of the account that owns the cert
#   APPLE_PASSWORD             an app-specific password for that Apple ID
#   APPLE_TEAM_ID              the 10-character Team ID
# How to create and add them: docs/MAINTAINER.md, "macOS signing".
# If any are missing the macOS job stops with an error rather than publishing
# an unsigned build under a release that says it is notarized.
# Windows signing is a follow-up (needs a code-signing cert + a sign step).
name: desktop-app
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to build. The Mac app is usually released from a Mac with scripts/release-mac.sh, which is much faster."
        type: choice
        default: linux
        options: [linux, macos, all]
  push:
    tags: ['node-app-v*']
permissions:
  contents: write
jobs:
  build:
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        # A release tag, or "linux" by hand: Linux on x86 and ARM. "macos" by
        # hand: the Mac only. "all": everything.
        os: ${{ fromJSON(github.event.inputs.platforms == 'macos' && '["macos-latest"]' || github.event.inputs.platforms == 'all' && '["macos-latest","ubuntu-22.04","ubuntu-22.04-arm"]' || '["ubuntu-22.04","ubuntu-22.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache ~/.cargo + target/ for both crates (sidecar and app) so repeat
      # release builds skip recompiling the whole dependency graph. Keyed per OS
      # and invalidated when either Cargo.lock changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            commons
            src-tauri
          key: ${{ matrix.os }}
      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Build node sidecar for this OS
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/host: //p')
          cargo build --release --manifest-path commons/Cargo.toml
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp commons/target/release/hic-commons.exe "src-tauri/binaries/hic-commons-$TRIPLE.exe"
          else
            cp commons/target/release/hic-commons "src-tauri/binaries/hic-commons-$TRIPLE"
          fi
      # The tauri bundler signs whenever APPLE_CERTIFICATE is *defined*, even
      # empty, so the APPLE_* variables are only exported once all six are known
      # to be present. (An empty/bad cert once broke every macOS build.)
      - name: Turn on macOS signing + notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          TI: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in C:APPLE_CERTIFICATE CP:APPLE_CERTIFICATE_PASSWORD SI:APPLE_SIGNING_IDENTITY AI:APPLE_ID AP:APPLE_PASSWORD TI:APPLE_TEAM_ID; do
            short="${v%%:*}"
            [ -n "${!short}" ] || missing="$missing ${v#*:}"
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS signing secrets missing from the macos-signing environment:$missing"
            exit 1
          fi
          # Pasted values often carry a stray newline, carriage return or space.
          # Base64 ignores whitespace, so strip it all from the certificate; trim
          # the ends of the others, and stop (naming the secret, never its value)
          # if one still spans several lines.
          C=$(printf '%s' "$C" | tr -d ' \t\r\n')
          # The signing identity is ordinary text ("Developer ID Application:
          # NAME (TEAMID)"); a long pasted line often wraps, so join its lines
          # with single spaces rather than refusing it.
          SI=$(printf '%s' "$SI" | tr '\r\n\t' '   ' | tr -s ' ' | sed -e 's/^ //' -e 's/ $//')
          trim(){ printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d'; }
          bad=""
          for v in CP:APPLE_CERTIFICATE_PASSWORD SI:APPLE_SIGNING_IDENTITY AI:APPLE_ID AP:APPLE_PASSWORD TI:APPLE_TEAM_ID; do
            short="${v%%:*}"
            val=$(trim "${!short}")
            [ "$(printf '%s' "$val" | wc -l)" -eq 0 ] || bad="$bad ${v#*:}"
            printf -v "$short" '%s' "$val"
          done
          if [ -n "$bad" ]; then
            echo "::error::These secrets contain more than one line; set them again with only the value:$bad"
            exit 1
          fi
          {
            echo "APPLE_CERTIFICATE=$C"
            echo "APPLE_CERTIFICATE_PASSWORD=$CP"
            echo "APPLE_SIGNING_IDENTITY=$SI"
            echo "APPLE_ID=$AI"
            echo "APPLE_PASSWORD=$AP"
            echo "APPLE_TEAM_ID=$TI"
          } >> "$GITHUB_ENV"
      - name: Build + release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bake the default commons into the app at compile time (option_env! in
          # src-tauri/src/lib.rs), so downloaded apps pre-fill "Share to a commons".
          # Set as a repo/org Actions variable, NOT in source.
          HIC_SHARE_DEFAULT: ${{ vars.HIC_SHARE_DEFAULT }}
          # What pages call that commons, instead of its address.
          HIC_SHARE_DEFAULT_NAME: ${{ vars.HIC_SHARE_DEFAULT_NAME }}
          # APPLE_* come from the signing step above via $GITHUB_ENV (macOS only).
        with:
          tagName: v__VERSION__
          releaseName: "Held In Common __VERSION__"
          # Kept here (not just hand-edited on the release) so each CI run re-applies it.
          releaseBody: |
            **Held in Common — the desktop node app.** Download the file for your computer, open it, and you're running your own node.

            | Your computer | Download |
            |---|---|
            | macOS — Apple Silicon (M1–M4) | `Held-In-Common-macOS-AppleSilicon.dmg` |
            | Linux — Ubuntu / Debian, x86 | `…_amd64.deb` |
            | Linux — Ubuntu / Debian, ARM (DGX Spark, Raspberry Pi 5) | `…_arm64.deb` |
            | Linux — any distro | `…_amd64.AppImage` (x86) or `…_aarch64.AppImage` (ARM) |
            | Linux — Fedora / RHEL | `….x86_64.rpm` or `….aarch64.rpm` |

            Not sure which Linux file? Run `uname -m`: `x86_64` means x86, `aarch64` means ARM.

            - **macOS:** the app is signed and notarized by Apple. Open the `.dmg`, drag **Held In Common** into **Applications**, and open it.
            - **Linux (.AppImage):** `chmod +x` the file, then run it. (Install `libfuse2` if it won't start.)
            - **Linux (.deb):** `sudo apt install ./<the .deb>`, then launch **Held In Common**.
            - Full guide: `docs/INSTALL.md`.

          prerelease: false
      # Check Apple accepted it, then publish the .dmg under the stable name the
      # install guide links to (replacing the old unsigned one).
      - name: Verify notarization and publish the stable .dmg name
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          cp "$DMG" Held-In-Common-macOS-AppleSilicon.dmg
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          gh release upload "v$VERSION" Held-In-Common-macOS-AppleSilicon.dmg --clobber
