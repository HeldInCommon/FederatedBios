[package]
name = "hic-onboarding-app"
version = "0.9.2"
edition = "2021"

[lib]
name = "hic_onboarding_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Writes the app's and the server's output to a log file people can send for support.
tauri-plugin-log = "2"
# Opens mailto: links ("Email this invite") in the person's own mail app.
tauri-plugin-opener = "2"
# Shows news from the node (e.g. "now listed on …") as system notifications.
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The launch token's randomness (ADR 0023), from the operating system's secure
# source on every platform. The same crate and version the server uses for
# session tokens (commons/src/sessions.rs).
rand = "0.8"
