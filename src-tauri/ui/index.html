<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>Held in Common — Node</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#fff;color:#111;
       font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .box{text-align:center}
  h1{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:34px;letter-spacing:-.02em;margin:0}
  .dot{color:#ff2d9b}
  .sub{color:#6f6f6f;margin-top:10px}
</style></head>
<body>
  <div class="box"><h1>Starting your node<span class="dot">.</span></h1><p class="sub" id="s">Warming up the commons…</p></div>
  <script>
    const url = 'http://localhost:8080';
    let n = 0;
    async function go(){
      n++;
      try { const r = await fetch(url + '/health', {cache:'no-store'}); if (r.ok){ location.href = url; return; } } catch(e){}
      if (n > 40) document.getElementById('s').textContent = 'Still starting… this can take a moment on first run.';
      setTimeout(go, 600);
    }
    go();
  </script>
</body></html>
